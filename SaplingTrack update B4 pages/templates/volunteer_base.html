<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Your saplings{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="volunteer">
  <div class="vol-strip"><span class="leaf">❦</span> SaplingTrack</div>
  <div id="offline-banner" class="banner" hidden>Not saved yet, will retry when you have signal</div>
  <main class="narrow">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='offline.js') }}"></script>
  <script src="{{ url_for('static', filename='animate.js') }}"></script>
</body>
</html>
